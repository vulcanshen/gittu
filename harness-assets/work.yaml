  - id: 21
    spec: 28
    implementation: |
      [1] CHANGES 的 tgo List.Marks；item operation m：Mark — this file, to work on the marked together／Unmark — this file（同一個鍵用 Hidden 分開；hint m:mark／m:unmark），List.ToggleMark，App Log Marked <路徑>／Unmarked <路徑>
      panel operation（有標記時才出現，沒有熱鍵；Action.Live 的說明寫「<N> file(s)」，N 是會作用到的檔；N 是 0 或 git 在跑時停用）：
      Stage the marked（UNSTAGED 的列；git add -A -- <路徑>…；每個檔記 Staged <路徑>）、Unstage the marked（STAGED；git restore --staged -- <路徑>…，還沒有 commit 時 git rm --cached -r；每個檔記 Unstaged <路徑>）、
      Use mine／Use theirs for the marked（CONFLICTS；git checkout --ours|--theirs -- <路徑>… 再 git add -A；Success <N> files resolved with mine|theirs and staged）、
      [X] Discard the marked（熱鍵 X，tdp main K13；有標記時才在，沒有標記時 X 什麼都不做；STAGED、UNSTAGED；confirm DISCARD: <N> files「Discard the changes to <N> files?」，內容列出路徑（最多 8 個，其他寫 and <N> more）與無法復原、沒追蹤的會刪掉（Peach）；一個一個照 task 12 的 Discard，有 stage 的連 index 一起；每個檔記 Discarded the change to <路徑>，Success Discarded the changes to <N> files）、
      Remove the marked、Ignore the marked（同下面單一的，路徑列在 confirm 裡）
      標記的列照它的組（ID 的前綴）與 snapshot 找到檔；同一個檔兩列只算一次；開始做時 List.ClearMarks
      Mark all（List.SetMarked 每一列；App Log Marked every file）、Clear marks（List.ClearMarks；App Log Cleared the marks）
      item operation Remove — this file from the repository（沒有熱鍵；還在 index 裡的檔：不是沒追蹤、不是已經 stage 成刪除，不在衝突）：confirm REMOVE「Remove <路徑>|<N> files from the repository?」，
      內容 Deleted, and the next commit takes them out of the repository.，有沒 commit 的改動時加 Their changes not committed are lost: it can't be undone.（Peach）；git rm -q -f -- <路徑>…；Success Removed <路徑>|<N> files from the repository
      item operation Ignore — add this file to .gitignore（沒有熱鍵；不在衝突）：有還在 index 裡的檔時 confirm IGNORE「Add <路徑>|<N> files to .gitignore?」，內容 Tracked ones stop being tracked…（Peach），沒有就不問；
      先 git rm -q --cached -- <還在 index 裡的>，再把每個檔的一行 /<路徑>（* ? [ \ 前面加 \，尾端空白寫成 \ ）加到頂層 .gitignore 的最後（原本最後沒換行先補一個；已經有的那一行不再寫）；Success Added <路徑>|<N> files to .gitignore
      失敗時照 task 8：error popup <動作> FAILED（STAGE、UNSTAGE、RESOLVE、DISCARD、REMOVE、IGNORE）
