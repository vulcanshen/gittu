tasks:
  - id: 1
    spec: 22
    implementation: |
      兩個畫面（tgo Screen）：History（Key H，打開時的畫面；[1] BRANCHES、[2] 的 CURRENT／ALL 分頁，task 5）與 Working tree（Key W；[1] CHANGES、[2] DIFF）；畫面 chip 與切換畫面由 tgo 畫、記 App Log（Switched to …）
      Working tree 兩個 panel、History 三個；Layout 1:2（[1] 是寬度的三分之一，60 欄時 20｜40），History 的 [3] FILES 在 [2] 下面、高度是右邊的三分之一（task 6）；最低尺寸用 tgo 的預設 60×32，沒有設 NarrowBelow
      statusbar（tgo App.Status）：先 Branch: <HEAD 的分支>（Lavender；detached 時 detached at <短 hash>，還沒有 commit 時 no commits yet），
      有 upstream 時接 ↑N ↓N（Overlay0，只寫不是 0 的）；再 Repo: <repo 資料夾名>（Lavender）；merge、rebase、cherry-pick、revert 做到一半時接
      Merging:／Rebasing onto:／Cherry-picking:／Reverting: <對方>（Green）；背景有 git 指令在跑時改寫 Pushing…、Merging… 之類（Green），兩個是同一欄、不同時出現；標籤 Overlay0
      寬度固定：給 tgo 的 span 一律是 tgo 給的寬度 w（畫面的一半），左邊對齊、最後補空白；Branch 那一欄（名字加 ↑N ↓N）寬 clamp((w − 16 − repo 名的寬) / 2, 8, 28)，
      放不下時名字從尾端截、加 …（太窄時只留名字），後面補空白；所以換到名字比較長的分支時，Branch 與 Repo 都不動
      q 與 Ctrl-C：tgo App.QuitFlow；沒有 git 指令在跑時直接離開（tea.Quit）；有在跑時開 confirm QUIT「Quit gittu?」，內容 git is still at work: <在做什麼>（Peach）；有 popup 開著時 tgo 先問
      git 指令都是 internal/git 呼叫使用者 PATH 上的 git：工作目錄是 repo 的頂層，環境加 GIT_TERMINAL_PROMPT=0、GIT_MERGE_AUTOEDIT=no、GIT_OPTIONAL_LOCKS=0，
      Setsid（沒有控制終端機，ssh、gpg 開不了 /dev/tty）；改 repo 的操作在背景跑（tea.Cmd），跑完重新讀整個 repo、換上畫面
      L4 的畫面測試：tdptest 每一格畫面都量；tdptest.Check 在各種尺寸與 icon 寬度走第一次啟動；gittu 自己會開的 popup（diff viewer、new branch 的 text input、
      reset 的 select、checkout 的 confirm、commit 的 textarea、stash 的 text input）各在 80×32 打開，用 tdptest.EachIconWidth 跑三種寬度，
      開著改成 60×32、50×32、80×12、50×12、59×32、80×5、1×1，再回到 80×32：每一格都滿寬、不當掉；popup 自己的框由 tgo 測（tdp E8）
    test: [TestHistoryLayout, TestFileStatusScreen, TestStatusbarSaysTheMerge, TestStatusbarKeepsItsPlace, TestQuitAtOnce, TestQuitAsksWhileGitRuns, TestFirstLaunch, TestOwnPopupsEverySize]
  - id: 2
    spec: 17
    implementation: |
      cmd/gittu/main.go：
      gittu：打開目前目錄所在的 repo；gittu <路徑>：打開那個路徑所在的 repo（git rev-parse --show-toplevel 往上找；bare repo 不算）
      gittu version、-v、--version：印 internal/version.Display()；gittu help、-h、--help：印用法，寫明資料夾叫 version、help 時打 ./version
      - 開頭的不認得的旗標：stderr 印 gittu: Unknown flag "<旗標>"、空一行、用法，結束碼 2；兩個以上的路徑：gittu: One path at most、空一行、用法，結束碼 2
      句子照 toast 一列的寫法開頭大寫（名字或路徑開頭時照它的大小寫）；結果（版號、用法）寫到 stdout，錯誤寫到 stderr、開頭 gittu: （tdp v1.2.18 的 E1、E1-4 到 E1-8）
      不是 repo、路徑不在：不開畫面，stderr 印 gittu: <路徑> is not in a git repository（或系統的原因），結束碼 1；PATH 上沒有 git：gittu: git not found in PATH，結束碼 1
    test: [TestVersionAndHelp, TestNotARepository, TestNoGit, TestBadArguments, TestOpenFindsTheTop]
  - id: 3
    spec: 22
    implementation: |
      [1] 有四個分頁（tgo Panel.Tabs：label Branches、Tabs Remotes、Tags、Stashes；OnTab 把 Body 換成那一頁的 List），h|l 切換（tgo 做，下框 hint 寫 h|l:tab）；
      每一頁是自己的 tgo List：單欄、沒有表頭，Filterable（/ 篩選，panel operation [/] Filter 篩目前那一頁）；BRANCHES 那一頁有 Flags（標記欄放旗標）
      BRANCHES（git for-each-ref refs/heads，照名稱排）、REMOTES（refs/remotes，不列 <remote>/HEAD，照名稱排）、
      TAGS（refs/tags，annotated tag 指它的 commit；照版本的數字排，v1.9 在 v1.10 前面）、STASHES（git stash list，stash@{N}: <訊息>）
      沒有東西的頁：No remote branches / Press [f] to fetch every remote（沒有 remote 時 This repository has no remote / Press [Space] to see what you can do here）、
      No tags / Press [t] to tag HEAD（還沒有 commit 時提示改成 Press [Space] to see what you can do here）、No stashes / Press [S] to stash the changes（沒有改動或還沒有 commit 時同上）；每次讀完 repo 照當下換
      目前的分支在標記欄畫 Green 的 ●；有 upstream 的本地分支名稱後面接 ↑N ↓N（Overlay0，只寫不是 0 的）；upstream 在遠端被刪掉了（git 的 [gone]）時寫 nf-md-cloud_off_outline（U+F0165）加 upstream gone（glyph 與字都是 Peach）
      打開時 cursor 停在目前的分支上
      cursor 移到分支、遠端分支、tag 上時先記下那一列，[2] 在 Current 分頁就照 task 5 用它重排分支圖；
      cursor 移到分支、遠端分支、tag、stash 上（每一頁的 tgo List.OnMove；換分頁時是換到的那一頁的 cursor）：它指的 commit 在分支圖裡時，[2] 先清掉那個清單的篩選（List.ClearFilter；tdp v1.2.18 panel.14 的「app 自己的動作先清掉篩選」、panel-180），再移 cursor 過去（List.Select；不在分支圖裡就什麼都不動，篩選也不清）；focus 留在 [1]
      分支、遠端分支、tag 上的 Enter（[Enter] Show — its commit in [2]；hint Enter:show；stash 那一列沒有，它的 Enter 是 task 8 的 Show）：
      [2] 先清掉那個清單的篩選（List.ClearFilter；tdp v1.2.18 panel.14 的「app 自己的動作先清掉篩選」、panel-180），不管篩選有沒有擋住那個 commit；[2] 的 cursor 停在它指的 commit（List.Select，下一格畫面捲到看得到），
      tgo App.Focus 把 focus 移到 [2]；不記 App Log。那個 commit 不在分支圖裡時不移動 focus，Info toast：遠端分支隱藏著、而它是遠端分支時
      「<名字> is not in the graph」「Press [Space] on [2] to show remote branches」（Show remote branches 沒有熱鍵，在 [2] 的 Space menu），其他時候「<名字> is not in the graph's 1000 newest commits」
      repo 沒有任何分支時：空狀態 No branches yet / Press [Space] to see what you can do here；還沒讀到過 repo 就讀失敗時兩個 panel 都是 Can't read <repo>: <說原因的那一行>（Red）/ Press [R] to read it again（tgo Panel.Fail），App Log 記 Error 的同一句與 git 印的全文；
      讀到過之後再失敗（[R]efresh、背景的重讀、操作後的重讀）：舊的內容留著，Error toast「Can't read <repo>: <說原因的那一行>」「Press [R] to read it again」，git 印的全文記進 App Log（背景的重讀（task 19）接連失敗、說原因的那一行跟上一次一樣時不跳也不記，換了一種才再跳、再記；又讀得到時記一筆 INFO The repository can be read again，不跳 toast（tdp v1.2.18 的 note.7、note-105，使用者 2026-11-19 在 tdp session 選 A）；說原因的那一行同 task 8）
    test: [TestBranchTabs, TestBranchTabsEmpty, TestBranchTabsEmptyHints, TestBranchMovesTheGraph, TestBranchesEmpty, TestUpstreamGone, TestEnterShowsTheCommit, TestActionsClearTheFilter, TestEnterOnARemoteBranchHidden, TestFirstReadFails, TestReadTheSample, TestVersionCompare]
  - id: 4
    spec: 23
    implementation: |
      [2] COMMITS 是 tgo List，Filterable（/ 篩選 commit 的每一欄）：欄 GRAPH、HASH（短 hash）、DESCRIPTION（Shrink，最少 12 格）、
      AUTHOR（Shrink，最少 6 格，Drop 2）、DATE（YYYY-MM-DD，Overlay0，Drop 1）
      讀 git log --topo-order -n 1001 --format=%H %P %an %at %s --branches --tags HEAD，遠端分支畫出來時（task 18）再加 --remotes；多於 1000 個只留 1000 個
      分支線（internal/git Graph）：一個 commit 一列，每條線一欄兩格：commit ◉（U+25C9）、往下 │、合進來 ╯ ╰、分出去 ╮ ╭、併進已經在往下的線 ┤ ├、
      橫線經過的線 ┼、橫線中間的合流與分岔 ┴ ┬、橫線 ─；線最多畫幾條照 [2] 的寬度：[2] 寬 − 框與留白 4 − HASH 9 − DESCRIPTION（最長的標題 + 2）− AUTHOR（最長的作者 + 2）− DATE 12，剩下的一條線兩格，至少 10 條（git.Graph 的 most）；再多的線，那個位置畫 …（Overlay0）；版面算出的 [2] 寬度變了（終端機縮放、z 放大）時重排分支圖；每條線照分出來的順序輪 Blue、Green、Mauve、Peach、Teal、Pink、Sapphire、Flamingo
      DESCRIPTION 只寫標題；有 ref 指著的 commit 佔兩列（tgo Row.Below）：第二列 GRAPH 那一格是往下的線（git.Through：有往下筆畫的 │ ╮ ╭ ┬ ┼ ├ ┤，
      與有 parent 的 commit 點，畫成同一條線顏色的 │，其他空白），DESCRIPTION 那一格是 ref：分支是 nf-dev-git_branch（U+E725）加名字，本地分支 Green、遠端分支 Mauve；
      tag 是 nf-md-tag（U+F04F9）加名字，Peach；ref 之間空一格；HEAD 所在的分支粗體；detached 時 HEAD 寫在最前面；遠端分支隱藏時不寫遠端分支的 ref
      cursor 只畫在第一列，第二列跟著畫 Surface1 底（tgo）；j|k gg|G 一次移一筆、N of M 算筆數；篩選也比對第二列，打分支或 tag 的名字找得到它的 commit
      主線（git.Graph 的 main：All 是 main 或 master 的 commit，Current 是 HEAD，task 5）：它與它的第一個 parent 一路往下一律在第一欄，其他線不佔第一欄（主線出現之前那一欄空白）；
      主線 commit 出現時，其他等著它的欄合進第一欄
      位置列（List.Location）：All branches 或 Current branch，遠端分支畫出來時接 · with remote branches；進到 commit 裡時接上那一層（task 6）
      空的 repo：空狀態 No commits yet / Press [W] to see the files to commit；讀失敗同 task 3
      [2] 的 List.Spread 是 SpreadFill、DESCRIPTION 的 Column.Fill：各欄都放得下最寬的值還有剩時，剩下的全給 DESCRIPTION，AUTHOR、DATE 貼右邊（terminu-go v1.2.20-beta.2）
    test: [TestDescriptionFills, TestGraphRows, TestGraphWidensWithRoom, TestGraphMostLines, TestFilterFindsARef, TestThrough, TestGraphMainLine, TestGraphWithWideIcons, TestGraphDropsColumnsWhenNarrow, TestHistoryFilter, TestGraphOfAMerge, TestGraphCapsTheLines, TestBranchesEmpty]
  - id: 5
    spec: 19
    implementation: |
      [2] 是有兩個分頁的 tgo Panel：Label Current、Tabs [All]，h|l 切換（tgo），OnTab 換 g.all 後用讀好的重排分支圖（不重新讀 repo），不記 App Log；
      打開時在 Current，切到哪一個只記到 gittu 關掉（不存檔）
      兩個分頁畫的 commit 一樣（全部的本地分支、tag、HEAD；遠端分支照 task 18），只差 git.Graph 的主線：
      Current 是 [1] cursor 那一列（分支、遠端分支、tag）指的 commit，[1] 還沒有 cursor、或它指的不在分支圖裡時是 HEAD；All 是 main（沒有就 master，兩個都沒有就沒有主線）
      [1] 的 cursor 移到分支、遠端分支、tag 上（task 3 的 OnMove；stash 不算）時記下那一列，Current 分頁立刻用它重排分支圖；All 分頁不重排
      位置列：Current 寫那一列的名字（HEAD 時寫目前的分支，detached 時 HEAD），All 寫 All branches；遠端分支畫出來時接 · with remote branches
    test: [TestAllOrCurrentBranch, TestGraphMainLine, TestTrace]
  - id: 6
    spec: 23
    implementation: |
      [3] FILES（History 的第三個 panel，在 [2] 下面）是 tgo List：一欄路徑（Shrink、Path：太長從前面截），Flags 標記欄，Filterable；label Files
      [2] 的 List.OnMove（tgo 在每個訊息之後、畫面之前跑；[1] 帶動的 Select、trace 也算）叫 showFiles：cursor 上的 commit 跟上次一樣就不讀；
      位置列 <第一個 parent 的短 hash>（第一個 commit 是 empty）↔ <commit 的短 hash>；
      git diff --name-status -M -z <parent> <commit>（第一個 commit 用 git diff-tree --root），加 --numstat 認出二進位檔，
      每一項 DiffItem{Mark, Name: <路徑>（改名寫 <舊> → <新>）, Anchor: <舊路徑> @ <parent>, Other: <路徑> @ <commit>}；
      Mark：A（第一個 commit 的 C 也是）DiffAdded、D DiffRemoved、copy DiffAdded、其他（M、R、T）DiffChanged；
      Text（不是二進位檔才有）：git show <parent>:<舊路徑> 與 git show <commit>:<路徑>，新增的左邊空、刪除的右邊空；
      一項一列，ID 與內容是 Name，標記欄 + Green、- Red、~ Peach
      空狀態：沒有 commit 時 No commits yet / Press [W] to see the files to commit；commit 沒改檔案時 No files changed / Press [2] to go to the commits
      git 失敗時 [3] 的 tgo Panel.Fail：Can't read the files of <短 hash>: <說原因的那一行>（Red）/ Press [R] to read it again；每次讀完 repo 再試；整個 repo 讀不到時 [3] 跟 [1]、[2] 同一句
      [2] 的 commit 上 Enter（Space menu：[Enter] Files — this commit changed, in [3]；hint Enter:files）：tgo Action.ToDetails，focus 到 [3]（histP.Details 是 [3]）；不記 App Log
      [3] 的 item operation Enter（[Enter] Diff — its two versions, UNIFIED or SPLIT；hint Enter:diff；二進位檔停用）：App Log 記 Info Compared <Anchor> with <Other>，
      tgo App.OpenDiff(filesP, 那一項)：比較 popup（標題 DIFF 接 UNIFIED、SPLIT tab，第一列 <Anchor> ↔ <Other>，太長折行，寬度終端機寬 − 2），兩邊一樣時 Info toast「No differences between <Anchor> and <Other>」；
      git 失敗時 tgo 開 error popup
      [3] 的 panel operation z Unzoom（task 17）
    test: [TestCommitFilesAndDiff, TestFirstCommitFiles]
  - id: 7
    spec: 29
    implementation: |
      [2] 的 item operation [D]iff（tgo App.DiffModeAction(histP, commits, DiffMode{Key: D, InDetails: true, Noun: commit, Many: 每一列都是, Name: 短 hash, Items})；terminu-go v1.2.20-beta.2 前叫 CompareAction，InDetails 從 v1.2.21-beta.1 起）：
      進入 Diff 模式，[2] 與它的明細 [3]（histP.Details = filesP）一起在模式裡（tgo：兩個框都 Yellow、都寫 Diff，粗線在 focus 那個，focus 留在 [2]；anchor 那一列 Yellow；hint D|Enter:diff）；
      [3] 跟著 [2] 的 cursor（tgo 畫）：Items 跟 task 6 一樣（git diff --name-status -M <anchor> <另一個>），以 anchor 為基準：每一項 Anchor <路徑> @ <anchor>、Other <路徑> @ <另一個>，位置列 <anchor> ↔ <另一個>；
      cursor 在 anchor 上 [3] 是空狀態 Move to another commit to diff with <anchor>，在一樣的 commit 上 No differences between <anchor> and <另一個>，不跳 toast；
      [2] 上 D 或 Enter：focus 到 [3]（footer Esc:back）；[3] 的檔案上 D 或 Enter 打開比較；Esc：比較 → [3] → [2]（模式與 anchor 留著）→ 離開模式，[3] 回到 gittu 自己的內容（showFiles 照樣從 OnMove 更新）；
      模式裡 Tab、2、3 在 [2]、[3] 之間換，1 跳 Info toast Press [Esc] to leave Diff first；[1] 與其他鍵暫停
      原本的標記（List.Marks、[m]ark）與 panel operation [C]ompare the two marked commits 拿掉；原本進到 [2] 的差異清單（panel.10）改成放在 [3]
    test: [TestDiffTwoCommits, TestDiffSameCommits]
  - id: 8
    spec: 28
    implementation: |
      [1] 的 item operation（tgo Action；同一個鍵依那一列的種類用 Hidden 分開；改 repo 的在有 git 指令在跑時 Disabled）：
      本地分支（BRANCHES 那一頁）：[c]heck out（目前的分支停用；git checkout <分支>；平常不問，工作區有 staged 或 unstaged 的改動時（沒追蹤的檔不算），先 confirm「Check out <分支>?」，內容 Changes not committed come along to <去的地方>; git stops if they would be overwritten.（Peach）；Success toast Checked out <分支>）、[M]erge（confirm MERGE「Merge <分支> into <目前的分支>?」；git merge --no-edit）、
      Re[b]ase（confirm REBASE「Rebase <目前> onto <分支>?」，內容 Its commits are made again on top of <分支>.；git rebase）、[r]ename（text input RENAME: <分支>，舊名是灰字提議，
      檢查 git check-ref-format --branch 與同名分支，錯誤列 Not a valid branch name／There is a branch <名> already；git branch -m）、[x] Delete（confirm「Delete <分支>?」；git branch -d，
      沒合併時再開 confirm「Delete <分支> anyway?」，內容 <分支> is not merged: … are lost.（Peach），Enter 用 git branch -D）、Push（沒有熱鍵；git push <upstream 的 remote 或 origin> refs/heads/<分支>；沒有 remote 時停用）；
      merge、rebase、delete 在目前的分支上停用
      遠端分支（REMOTES 那一頁）：[c]heck out（confirm：沒有同名的本地分支時「Check out origin/x as x?」，內容寫會建一個追蹤它的本地分支，git checkout -b x --track origin/x；有的話「Check out x?」，git checkout x；工作區有 staged 或 unstaged 的改動時（沒追蹤的檔不算），confirm 多一句 Changes not committed come along to <去的地方>; git stops if they would be overwritten.（Peach））、
      [M]erge、Re[b]ase（同上）、[x] Delete（confirm「Delete x on origin?」，內容寫對每個人都刪掉、無法復原（Peach）；git push origin --delete x）
      tag（TAGS 那一頁）：[c]heck out（confirm，內容 HEAD is left detached…（Peach）；工作區有 staged 或 unstaged 的改動時（沒追蹤的檔不算），confirm 多一句 Changes not committed come along to <去的地方>; git stops if they would be overwritten.（Peach）；git checkout --detach refs/tags/<tag>）、[x] Delete（confirm「Delete the tag <tag>?」；git tag -d）、Push（沒有熱鍵；git push <remote> refs/tags/<tag>；沒有 remote 時停用）
      stash（STASHES 那一頁）：[Enter] Show（what it keeps, file by file：STASHES 先清掉那個清單的篩選（List.ClearFilter；tdp v1.2.18 panel.14 的「app 自己的動作先清掉篩選」、panel-180），再 tgo App.OpenDiff(branchP, DiffItem{Anchor: base of stash@{N}, Other: stash@{N}, Items})，Items 跟 task 6 一樣是 <stash>^1 對 <stash> 的檔案；App Log 記 Opened stash@{N}）、[a]pply（git stash apply）、P[o]p（git stash pop）、
      [x] Drop（confirm「Drop stash@{N}?」，內容是它的訊息與無法復原（Peach）；git stash drop）
      執行時 statusbar 寫 Checking out…、Merging… 之類；成功 Success toast（Merged x into main、Rebased main onto x、Renamed a to b、Deleted x、Applied stash@{0}……）；
      merge、rebase、apply、pop 停在衝突時（git 失敗而且有 unmerged 的檔）是 Warning toast「<Merge> stopped on conflicts in N files」「Resolve them in Working tree [W]」；
      其他失敗開 error popup <動作> FAILED，內容是git 說原因的那一行（第一個 fatal: 或 error: 開頭的，沒有就第一個不是 hint: 的），git 印的全文一列一筆記進 App Log（Error）（stderr，沒有就 stdout）；做完重新讀 repo（不管成功失敗）；改名、新分支後 cursor 移到新的那一列，移之前那一頁先清掉那個清單的篩選（List.ClearFilter；tdp v1.2.18 panel.14 的「app 自己的動作先清掉篩選」、panel-180）
    test: [TestCheckoutWarnsOfChanges, TestCheckoutBranch, TestMergeBranchConflicts, TestMergeAndRebaseBranch, TestRenameBranch, TestDeleteUnmergedAsksAgain, TestCurrentBranchOperationsOff, TestCheckoutRemoteBranch, TestDeleteRemoteBranch, TestTagOperations, TestStashOperations, TestPushBranch, TestDeleteUnmergedBranch, TestMergeStopsOnConflicts]
  - id: 9
    spec: 26
    implementation: |
