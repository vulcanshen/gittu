    tdp: [tdp panel.7, tdp P3, tdp M2, tdp M5, tdp M6, tdp note.7, tdp confirm, tdp toast.2, tdp F5, tdp F6, tdp K3, tdp panel.5, tdp K13, tdp K13-2, tdp K13-3, tdp M4]
    remark:
      - "刪除、drop、丟掉改動的鍵照 K13（tdp v1.2.20 的 K13、K13-2、K13-3：會永久拿掉東西的一項在 x、很多在 X，不在 D、d；D 是 Diff 模式；使用者 2026-11-20 在 kbu 定的家族規則）：分支、遠端分支、tag 的 [x] Delete，stash 的 [x] Drop，Working tree 有標記時 [X] Discard the marked（先 confirm）；一個檔的 Discard 沒有熱鍵（使用者 2026-11-20：「discard 不要用 x, 一樣沒有熱鍵」）、全域的 Discard all 沒有熱鍵（使用者 2026-11-20：「Discard all 不要熱鍵」，沒標記時按 X 不會丟掉全部）（K13 只規定給了鍵就在 x、X，沒規定一定要有鍵）；Remove（git rm）也會刪檔，沒有熱鍵"
      - "[1] CHANGES 是可以標記的清單（tdp panel.7、P3 的整批標記）：標記的列在標記欄畫 Green 的 nf-md-checkbox_marked（tgo 畫）；m 標記或取消 cursor 那一列（item operation [m]ark／Un[m]ark，hint m:mark／m:unmark；使用者 2026-11-20 定 m，檔案那一層的 Use mine 因此沒有熱鍵，task 14）"
      - "對標記的檔做事是 panel operation（tdp P3），只在有標記時出現，沒有熱鍵（使用者：勾選 → Space menu 操作）：Stage the marked、Unstage the marked、Use mine for the marked、Use theirs for the marked、Discard the marked、Remove the marked、Ignore the marked；說明欄寫會作用在幾個檔。每一個只作用在適用的檔：Stage 對 UNSTAGED 的列、Unstage 對 STAGED、Use mine／theirs 對 CONFLICTS、Discard 與 Ignore 對 STAGED 與 UNSTAGED、Remove 對還在 index 裡的；同一個檔兩列都標了算一次；一個都不適用時停用（tdp M6）；開始做就清掉標記"
      - "[M]ark all（標記清單裡每一列；使用者 2026-11-20：「[m]ark 單一筆, [M]ark all 大寫M」；全都標了時同一個鍵是 Unmark all，使用者：「在按一次 M 應該是 unmark all」，跟 m 在一列上一樣；Clear marks 只在標了一部分時出現）：panel operation；M 也是全域的 [M]erge，panel 的鍵優先（tdp M4），所以 Working tree [1] 上 M 是 Mark all，Merge 從 Space menu 的全域列、或其他 panel 按 M；清單是空的或全都標了時停用、不隱藏（M6），M 才不會換成 Merge；進到一個檔的衝突區塊時不出現（那一層不能標記）。Clear marks（有標記時）：panel operation，沒有熱鍵"
      - "Use mine／Use theirs for the marked 有檔在衝突之後改過時先 confirm，每個那樣的檔一行（task 14）"
      - "Mark the marked resolved（使用者 2026-11-20：「[R] 就是多選後 mark as resolved 所有勾選檔案」；說了 R 也是全域的 [R]efresh 後改成：「[R]esolve 全部這個熱鍵就取消, 一樣用 mark 多筆或單筆 resovle」）：panel operation，沒有熱鍵，跟其他對標記的檔做的事一樣從 Space menu；對標記的衝突檔 git add（task 14 的 Mark resolved）；有檔還有衝突標記時先 confirm，列出那些檔與行號，沒有就不問"
      - "Remove（item operation，沒有熱鍵；還在 index 裡、不在衝突的檔）是 git 的 remove：git rm -f，刪掉檔案並 stage 刪除，下一個 commit 把它從 repo 拿掉；先 confirm（REMOVE），有沒 commit 的改動時多一句會不見（Peach，tdp confirm）。已經 stage 成刪除的檔不在 index 裡，沒有 Remove"
      - "Ignore（item operation，沒有熱鍵；不在衝突的檔）：寫進 repo 頂層的 .gitignore，一個檔一行 /<路徑>（從頂層算、只對到它；* ? [ \\ 與尾端空白跳脫），已經有那一行就不重寫；還在 index 裡的檔先 git rm --cached（git 不會忽略已經追蹤的檔），檔案留著；有這種檔時先 confirm（IGNORE）說它們不再被追蹤，只有沒追蹤的檔時不問"
      - "App Log（tdp note.7：P3 的動作都記）：Marked <路徑>、Unmarked <路徑>、Marked every file、Cleared the marks；整批的 stage、unstage 每個檔一筆（跟單一的同一句）；Discard、Remove、Ignore 整批時每個檔一筆，再加一個 Success toast 說幾個檔；Use mine／theirs 整批時一個 Success toast（<N> files resolved with mine and staged）"
      - "鍵、git 的做法（git rm、.gitignore 的寫法、已追蹤的檔停止追蹤）是 app 照 git 的意思決定的預設（使用者沒有指定）"
