id: 12
from: v1.2.16
to: v1.2.17
tasks:
  - id: 1
    spec: 11
    request: 開啟時的畫面：左右兩個面板，左邊是分支列表，右邊是分支圖，跟 SourceTree 一樣
    tdp: [tdp terms.2, tdp terms.3, tdp P3, tdp P5, tdp screen.1, tdp screen.2, tdp screen.3, tdp screen.4, tdp screen.7, tdp panel.1, tdp panel.4, tdp components.2, tdp components.4, tdp K1, tdp K2, tdp K9, tdp M4, tdp L1, tdp L2, tdp L3, tdp L4, tdp L5, tdp E5, tdp E8, tdp note.7, tdp screen.5, tdp confirm, tdp color]
    remark:
      - |
        版面（打開時是 History 畫面；tdp screen.1、screen.3、screen.4）：
         [H]ISTORY[W]ORKING TREE                 Branch: main ↑1        Repo: gittu
        ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        ┏[1] BRANCHESR/T/S━━━━━┓┌[2] COMMITS─────────────────────────────────────────┐  ← [1] 的分頁：BRANCHES、REMOTES、TAGS、STASHES（task 3）
        ┃ ● main ↑1            ┃│ All branches                                        │  ← 位置列（task 4、6）
        ┃   feature            ┃│    GRAPH  HASH     DESCRIPTION           AUTHOR DATE│
        ┃   topic              ┃│    ◉      a1b2c3d  main Fix the graph    vulcan …   │
        ┃                      ┃│    │ ◉    …                                         │
        ┃                      ┃│    ◉─╯    …                                         │
        ┗━ Enter:show h|l:tab ━┛└─ Enter:files ────────────────────────── 1 of 300 ─┘
        Space:menu ?:help !:log Tab|1–2:panels q:quit
      - "兩個畫面（tdp terms.2）：History（[1] BRANCHES、[2] COMMITS，打開時的畫面）與 Working tree（[1] CHANGES、[2] DIFF，task 11）。工作區的檔案（stage、commit、解衝突）要一個檔案清單加差異，跟分支列表加分支圖放不進同一個畫面。切換畫面是 global operation（tdp P3），畫面 chip 的熱鍵 [H]istory、[W]orking tree（tdp screen.3）"
      - "名字（使用者 2026-11-19：File status 怪、History 畫面裡又有一個 History panel 也怪）：File Status 是 SourceTree 自己的叫法，git 的名詞是 working tree，在終端機用 git 的人認得的是後者，所以第二個畫面叫 Working tree；畫面與 panel 不同名，[2] 放的是一個一個 commit，叫 COMMITS，第二個畫面的 [1] 放的是有改動的檔，叫 CHANGES（名字是 app 的內容：tdp terms.2、terms.3、panel.1、screen.3 只規定畫面 chip 與 [N] label 膠囊怎麼畫、怎麼大寫）"
      - "[1] 與 [2] 照 1:2 分寬：60 欄時是 20｜40，分支名稱與分支圖都還讀得到（tdp L1 的為什麼）；最低尺寸用預設 60×32（tdp L1），60 欄以上兩個 panel 一律並排，所以沒有窄寬（tdp screen.5 的門檻 app 自行決定，不能高於 60）"
      - "statusbar 在畫面 chip 列右邊（tdp screen.4：多畫面的 app 用 chip 列的右邊），先 Branch 再 Repo（使用者 2026-11-19）：Branch: <HEAD 的分支>（detached 時寫 detached at <短 hash>）、有 upstream 時接 ↑N ↓N（只寫不是 0 的）；Repo: <repo 資料夾的名字>；兩個值都是 Lavender（tdp screen.4：你現在在哪的值）；merge、rebase、cherry-pick、revert 做到一半時接 Merging: <對方> 之類（Green：做到一半的 merge 也是進行中的工作，tdp screen.4、color 的 Green；2026-11-19 review 判 tdp 不清楚，使用者選回報，tdp session 回覆照這兩處用 Green）；正在跑的 git 指令接 Pushing… 之類（Green，進行中的工作）"
      - "statusbar 的寬度不跟著內容變（tdp L2）：tgo 把 statusbar 靠右畫，內容一變長，整串都會往左跑，所以 gittu 給的 statusbar 一律是 tgo 給的寬度（畫面的一半），左邊對齊、後面補空白；Branch 那一欄（名字加 ↑N ↓N）的寬度只看終端機寬度（放不下從尾端截、加 …），Repo 的名字整個執行期間不變；進行中的工作是最後一欄、不補空白（tdp L2：只有最後一個動態欄位可以不補）：git 指令在跑時寫在做什麼（Pushing…），沒在跑時寫做到一半的操作（Merging: <對方>），兩個不同時出現"
      - "q、Ctrl-C：沒有 git 指令在跑時直接離開（tdp K9：離開流程 app 可以自行決定，像 lazygit 一樣）；有 git 指令在跑（push、merge……）時先問（離開會把它中斷）；有 popup 開著時照 tdp K9 先問（tgo 做）"
      - "怎麼操作 git：呼叫使用者裝的 git 指令，不用 Go 的 git 函式庫（tdp P5：要呼叫哪些外部指令是功能邏輯）。理由：使用者的 git 設定（hooks、credential helper、ssh、gpg 簽章、pull.rebase）照樣生效；merge 與解衝突跟使用者在終端機打的 git 一模一樣；Go 的函式庫（go-git）沒有完整的 merge。git 指令都不給它終端機（自己的 session），所以不會在畫面上問密碼；要密碼時照錯誤處理（task 10）"
  - id: 2
    spec: 11
    request: 在終端機工作的人，在 repo 裡打 gittu 就打開那個 repo；還有 gittu version 與 gittu help
    tdp: [tdp E1, tdp P5]
    remark:
      - "gittu [路徑]：打開路徑所在的 git repo（repo 裡任何一個資料夾都可以，跟 git 一樣往上找）；沒給路徑是目前的目錄（tdp E1：其他指令 app 可以自行決定）"
      - "不是 git repo、路徑不在、找不到 git 指令時不開畫面：stderr 印 gittu: <原因>，結束碼 1，像 git 自己一樣（tdp P5 功能邏輯）"
      - "不認得的旗標（- 開頭）印用法到 stderr，結束碼 2；資料夾剛好叫 version、help 時寫 ./version（help 裡寫明）"
  - id: 3
    spec: 12
    request: 左邊是分支列表，跟 SourceTree 的側欄一樣，看得到本地分支、遠端分支、tag、stash；upstream gone 也加個 glyph；點了分支，右邊的分支圖跳到那裡；在 panel 1 按 Enter 切換 focus 到 history panel，捲到那個分支的 commit 點；REMOTE 和 TAG 用分頁作，不要都擠在一個 panel
    tdp: [tdp panel.1, tdp panel.4, tdp panel.5, tdp panel.7, tdp panel.13, tdp panel.14, tdp terms.4, tdp K12, tdp screen.8, tdp components.5, tdp P5, tdp K3, tdp toast.2, tdp panel.15, tdp M5, tdp note.8, tdp note.7, tdp F5, tdp panel.10, tdp panel.9]
    remark:
      - "[1] 有四個分頁（tdp terms.4、panel.4）：BRANCHES（本地分支）、REMOTES（遠端分支，origin/main）、TAGS、STASHES，照 SourceTree 側欄的順序；h|l 切換（tdp K12：一維清單放在有 tab 的 panel 裡，h|l 給 tab），下框 hint 在 Enter 後面寫 h|l:tab（tdp panel.1）。原本是一個清單分四組，使用者 2026-11-19 要 REMOTE 和 TAG 分頁、不要都擠在一個 panel；stash 也是另一種東西，一起拆成分頁。每個分頁是一般清單（tdp panel.5），照名稱排（tag 照版本的數字排，v1.10 在 v1.9 後面；stash 照 stash@{N} 的 N），tdp panel.5 的順序固定；每個分頁有自己的 cursor 與 / 篩選"
      - "沒有東西的分頁是空狀態（tdp screen.8）：No remote branches / Press [f] to fetch every remote；No tags / Press [t] to tag HEAD；No stashes / Press [S] to stash the changes；提示點名的鍵現在按不動時（沒有 remote、還沒有 commit、沒有改動，tdp M6 停用）改點名 Space（Press [Space] to see what you can do here），沒有 remote 的事實改寫 This repository has no remote（提示裡的鍵是 global operation 的熱鍵，在 [1] 上按得到）"
      - "單欄、不畫表頭（tdp panel.5：單欄的表頭 app 可以自行決定）。目前的分支在標記欄畫 Green 的 ●（tdp panel.7：不能標記的清單，app 可以把一種旗標畫在標記欄，glyph 與顏色 app 可以自行決定；跟 locku 的啟用中 profile 一樣）"
      - "本地分支有 upstream 時，名稱後面接 ↑N ↓N（Overlay0，只寫不是 0 的）：SourceTree 側欄也這樣標（tdp P5 領域的符號與顏色）。upstream 在遠端被刪掉了（git 寫 [gone]）時寫 nf-md-cloud_off_outline（U+F0165）加 upstream gone，用 Peach（glyph 是使用者 2026-11-19 要的，跟分支圖的 ref 一樣有 glyph）（值得注意：多半是合併完、遠端刪掉的分支，可以刪了）；原本只寫 gone，使用者看不懂（2026-11-19）"
      - "stash 一列寫 stash@{N}: <訊息>，訊息太長從尾端截（tdp panel.5）"
      - "/ 篩選（tdp panel.14）：分支多的 repo 找分支"
      - "cursor 移到分支、遠端分支、tag 上時（換分頁也算：換到的那一頁的 cursor），[2] COMMITS 的 cursor 跟著移到它指的 commit（不在目前的分支圖裡就不動）；focus 留在 [1]。照 SourceTree：點側欄的分支，分支圖跳到那裡。這跟明細（tdp panel.13）一樣是「另一個 panel 跟著 cursor 換」，不移動 focus（tdp K3）；[2] 進到 commit 的差異清單裡時（task 6、7）先退回分支圖（tgo Panel.LeaveDiff；比較模式留著），[2] 看得到的跟著換（tdp panel.13：cursor 一移動，明細的內容立刻換成新的那一筆）"
      - "分支、遠端分支、tag 上的 Enter：focus 到 [2] COMMITS，cursor 停在它指的 commit、捲到看得到（[2] 進到某個 commit 裡時先退回分支圖）。這個 Enter 與 cursor 移動都是 app 自己把 [2] 的 cursor 放到一個 commit 上：先清掉 [2] 的篩選，不管它有沒有擋住那個 commit；只是 focus 離開 [2] 不清（tdp main 7e62a11 的 panel.14、panel-180，使用者 2026-11-19 在 tdp session 選 A；還沒發版，發版後改引 panel-180）；hint Enter:show（使用者 2026-11-19：Enter 不要 checkout，checkout 是 [c]heck out，task 8）。按 Enter 就預期換到分支圖，所以可以移動 focus（tdp K3：app 的動作可以移動 focus，條件是使用者按下去時就預期會換）；換 focus 不記 App Log（tdp note.7）。它指的 commit 不在分支圖裡（遠端分支隱藏著、或超過讀進來的 1000 個）時不移動，跳 Info toast 說它不在分支圖裡；遠端分支隱藏著時多一句 Press [r] on [2] to show remote branches"
      - "[2] 在 commit 的差異清單裡（task 6、7，tgo 的 App.OpenDiff）時，Enter 與移動 cursor 先用 tgo Panel.LeaveDiff 退回分支圖：2026-11-19 回報給 tdp session 的缺口（app 看不出也退不回那一層），terminu-go v1.2.18 加了 LeaveDiff"
      - "repo 一個分支都沒有（剛 git init、還沒 commit）時是空狀態（tdp screen.8）：No branches yet / Press [Space] to see what you can do here"
  - id: 4
    spec: 8
    request: 右邊是分支圖，在終端機裡把分支線畫得清楚又好看，大 repo 裡也要夠快；commit 點不要只是單調的圓點
    tdp: [tdp panel.5, tdp panel.7, tdp panel.10, tdp panel.14, tdp panel.15, tdp screen.8, tdp components.5, tdp P4, tdp P5, tdp L2, tdp components.2, tdp F5]
    remark:
      - "[2] COMMITS 是一般清單（tdp panel.5），一個 commit 一列，欄：GRAPH、HASH（短 hash，7 格；panel 叫 COMMITS，欄不再叫 COMMIT）、DESCRIPTION（ref 加上標題，可以截短）、AUTHOR（可以截短）、DATE（YYYY-MM-DD）。欄放不下時先收 DATE、再收 AUTHOR（tdp panel.5 的整欄收）"
      - "分支線自己排，一個 commit 一列，不用 git log --graph 的輸出：git 的圖會多出只有線、沒有 commit 的列，cursor 會停在不是 commit 的地方。畫法照 lazygit、tig：每一條線一欄兩格，commit 是 ◉（U+25C9）：使用者 2026-11-19 嫌 ● 單調，看了 Nerd Font 的圓圈（nf-md-source_commit、nf-md-record_circle……）在自己終端機上的預覽後選的。Nerd Font 的 icon 在會讓 icon 溢出到下一格的終端機上，下一格空白時畫得大、下一格是線（─）時縮成一格，同一個 glyph 一個大一個小；◉ 是一般的 Unicode，一律畫在一格裡。往下的線 │，合進來、分出去用 ─ ╮ ╯ ╭ ╰，線交叉 ┼；每條線一個顏色，照分出來的順序輪 Blue、Green、Mauve、Peach、Teal、Pink、Sapphire、Flamingo（tdp P5：內容的符號與顏色是領域的；不用模式的 Yellow 與使用者足跡的 Lavender，tdp P4）。線超過 10 條時只畫前 10 條，最後一格畫 …（L2：GRAPH 欄不會無限變寬）"
      - "DESCRIPTION 前面接指著這個 commit 的 ref（tdp P5 的符號與顏色）：分支前面一個 nf-dev-git_branch（U+E725），本地分支 Green、遠端分支 Mauve；tag 前面一個 nf-md-tag（U+F04F9），Peach；glyph 與名字之間一格（tdp components.2），HEAD 所在的分支粗體；ref 之間空一格，再空一格接標題。遠端分支隱藏時（task 18）不寫遠端分支的 ref"
      - "使用者 2026-11-19 想讓 tag 像膠囊一樣顯示。膠囊是 tdp 的介面元素，意思是名稱（panel、分頁、畫面；tdp P4、panel.4），內容不能借用；用 glyph 加顏色（tdp P5：內容的符號與顏色是 app 的）。回報給 tdp session 後（2026-11-19）定案就是這樣：P5 已經放行，tdp 不改、不開 issue"
      - "順序：git log --topo-order（同一條分支的 commit 排在一起，線比較直；tdp panel.5 的順序固定：資料本身有順序）。大 repo：一次讀 1000 個 commit（README 的限制寫明），讀 log 加排線在 1000 個以內一下就好"
      - "位置列（tdp panel.10）寫目前的主線（All branches／Current branch，task 5），遠端分支畫出來時接 · with remote branches（task 18）；進到某個 commit 裡時接上那一層（task 6）"
      - "主線固定在最左邊（task 5）：主線 commit（All 是 main 或 master，Current 是 HEAD）沿著第一個 parent 往下的那一串，一律畫在第一條線；其他線不佔它，在主線 commit 出現之前那一欄留空"
      - "repo 還沒有 commit：空狀態 No commits yet / Press [W] to see the files to commit（tdp screen.8）；讀 log 失敗：tdp panel.15 的兩句（Red 的事實、Overlay0 的 Press [R] to read again）"
      - "/ 篩選（tdp panel.14）：找 commit 的標題、hash、作者"
  - id: 5
    spec: 6
    request: 分支圖可以切換「全部分支」和「目前分支」；像 SourceTree 一樣，兩者只差主線是誰：current 的時候 HEAD 一定在最左邊，all 的時候 main／master 在最左邊，或沒有主線
    tdp: [tdp P3, tdp M2, tdp M3, tdp M5, tdp M6, tdp panel.10, tdp note.7, tdp P5, tdp E3]
    remark:
      - "使用者 2026-11-19：All 與 Current 都畫全部的分支（遠端分支照 task 18 的開關），只差最左邊固定的主線：Current 是 HEAD 那一串，All 是 main（沒有就 master；兩個都沒有就不固定）。以下原本 Current 只畫 HEAD 走得到的 commit 的寫法改掉"
      - "[2] COMMITS 的 panel operation（tdp P3：作用在整個 panel），一個鍵 a 來回切：All 時是 Current br[a]nch（HEAD's line on the left），Current 時是 [a]ll branches（main's line on the left）；label 裡有 a，照 tdp M5 包第一次出現的那個（tgo 畫）；另一個用 Hidden 藏起來（tdp M6：對象不存在）"
      - "畫的 commit = 所有本地分支、tag 與 HEAD 走得到的（遠端分支照 task 18；不含 stash：stash 在 [1] 的 STASHES，跟 SourceTree 一樣）。預設是 All（SourceTree 的預設）；不存下來（tdp E3：刪了只是回到預設的東西才是狀態，這裡沒有必要多一個檔）"
      - "位置列寫目前是哪一種：All branches／Current branch（tdp panel.10：位置列寫目前的位置，要不要有 app 可以自行決定）"
      - "切換記 App Log（Info：Showing all branches, main on the left／Showing the current branch on the left；tdp note.7：只看不改的動作也記）"
  - id: 6
    spec: 12
    request: 看一個 commit：有哪些檔案變了，在檔案上按 Enter，看它前後的差異；按 Esc 一層一層退回；跟比較兩個 commit 一樣（使用者 2026-11-19）
    tdp: [tdp note.8, tdp panel.9, tdp panel.10, tdp K3, tdp K4, tdp T1, tdp note.7, tdp P5, tdp M5, tdp panel-177, tdp panel-178, tdp note-101, tdp note-102, tdp panel.14]
    remark:
      - "tdp note.8 的「同一項的兩個版本」與 panel.9 的「裝著許多項目的列」（tdp main，還沒發版；tdp #20 定案，使用者在 tdp session 與這裡都選 A）：看同一項的兩個版本一律打開 note.8 的比較（UNIFIED 與 SPLIT），舊的當 anchor，標題 DIFF — <舊的> ↔ <新的>；一個 commit 對它第一個 parent 的改動裝著許多項目，進去後照 panel.9 列出有差異的項目"
      - "[2] 的 commit 上按 Enter（[Enter] Files）：照 panel.10 一層一層進去，[2] 換成這個 commit 對它第一個 parent 有差異的檔案（第一個 commit 對空的），位置列是 <parent 的短 hash> ↔ <commit 的短 hash>（第一個 commit 的 parent 寫 empty）；每一項前面是 +（Green，新增）、-（Red，刪除）、~（Peach，修改），git 的 M／A／D／R 字母拿掉；一份平的路徑清單（panel.9：項目照 app 的叫法命名，檔案不裝東西，沒有再進一層）；改名是一列 ~ <舊> → <新>，比的是舊的對新的（panel.9）"
      - "檔案上按 Enter 打開 note.8 的比較：標題 DIFF — <路徑> @ <parent> ↔ <路徑> @ <commit>，新增的檔左邊是空的、刪除的右邊是空的；兩邊一樣（只改名）時不打開，Info toast（panel.9）。二進位檔沒有比較（panel.9：不是文字的項目沒有比較）。Esc 一層一層退回，最後回到分支圖、cursor 在剛剛那個 commit（tdp K4）"
      - "從 Space menu 執行進去（drill-down）時 menu 收起（tdp T1 的表）"
      - "記 App Log：Opened the changes of <短 hash> <標題>（tdp note.7：只看不改的動作也記）；進出那一層不記（換看的範圍）"
      - "清單、標記、比較 popup 都由 tgo 畫（App.OpenDiff；terminu-go v1.2.18-beta.1 起），gittu 只給每一項的名字、兩邊的名字與兩邊的內容（tdp E8：用 lib 的 app 不另外做 lib 做到的）"
  - id: 7
    spec: 7
    request: 比較兩個 commit：選兩個 commit，列出有變動的檔案；在檔案上按 Enter，看它前後的差異；按 Esc 一層一層退回
    tdp: [tdp panel.9, tdp note.8, tdp panel.10, tdp K11, tdp K4, tdp M6, tdp note.7, tdp P5, tdp M5, tdp panel-176, tdp panel-177, tdp panel-178, tdp panel-179]
    remark:
