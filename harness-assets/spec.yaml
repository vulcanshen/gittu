        Working tree 畫面（task 1 的第二個畫面）：
        ┏[1] CHANGES━━━━━━━━━━━┓┌[2] DIFF: internal/git/log.go───────────────────────┐
        ┃ All changes          ┃│ @@ -10,6 +10,8 @@                                   │
        ┃ CONFLICTS            ┃│  func Log(…)                                        │
        ┃ U README.md          ┃│ +  // topo order                                     │
        ┃ STAGED               ┃│                                                     │
        ┃ M internal/git/lo…   ┃│                                                     │
        ┃ UNSTAGED             ┃│                                                     │
        ┃ ? notes.txt          ┃│                                                     │
        ┗━ Enter:stage ━━━━━━━━┛└─────────────────────────────────────── 1-20 of 48 ─┘
      - "[1] CHANGES 是一般清單分三組（tdp panel.11）：CONFLICTS、STAGED、UNSTAGED（沒追蹤的檔也在 UNSTAGED）；同一個檔 stage 了一部分時兩組各一列。標記欄是改了什麼（tdp panel.7 的旗標）：M Peach、A Green、D Red、R Blue、? Overlay0（沒追蹤）、U Red（衝突）；一欄 PATH，太長從前面截（tdp panel.5）。位置列寫 All changes（畫面已經叫 Working tree，不再重複；進到衝突的檔裡時接上那一層，task 14）"
      - "[2] DIFF 是 [1] cursor 那個檔的明細（tdp panel.13，跟著 cursor 即時換）：label 寫 DIFF: <路徑>；內容是 git diff（STAGED 的是 git diff --cached，沒追蹤的檔整個當新增），diff 的語法顏色；沒有 cursor 的 panel（tgo Pager），j|k 捲動。[2] 上的 Enter 用 viewer 打開同一份 diff（tdp K3：沒有項目的 panel，Enter 對整個 panel 做最直觀的事），有搜尋與選取模式"
      - "沒有改動時是空狀態（tdp screen.8）：Nothing to commit / Press [H] to see the history"
      - "每 3 秒重新讀（task 10）時，[2] 的內容換了就重新放進去（tdp note.9 的重新讀進來；不算串流，失焦時變暗）"
  - id: 12
    spec: 1
    request: stage、unstage、捨棄改動都在 app 裡做
    tdp: [tdp P3, tdp M2, tdp M3, tdp M5, tdp K3, tdp F6, tdp confirm, tdp note.6, tdp note.7, tdp toast.2]
    remark:
      - "[1] CHANGES 的 Enter 照那一列在哪一組：UNSTAGED 是 Stage、STAGED 是 Unstage、CONFLICTS 是進去解衝突（task 14）；hint 照 cursor 那一列寫 Enter:stage／Enter:unstage／Enter:resolve（tdp K3：三組是三種項目，同一種永遠同一個動作）"
      - "item operation：[D]iscard（這個檔的改動，confirm、警告無法復原；沒追蹤的檔是刪掉它）；panel operation：Stage [a]ll、Unstage all（沒有熱鍵；u 是移動鍵，tdp K12）"
      - "stage、unstage 做完不跳 toast，檔案換到另一組就看得到（tdp toast.2：做完的事用不用 toast app 自行決定）；記 App Log（Staged <路徑>、Unstaged <路徑>）；cursor 留在原本的位置附近（換組的那一列不跟著走，連續按 Enter 可以一個一個 stage 下去）"
  - id: 13
    spec: 1
    request: commit 在 app 裡完成（SourceTree 下方打 commit 訊息的地方）
    tdp: [tdp textarea, tdp P3, tdp M4, tdp M6, tdp F6, tdp note.6, tdp note.7, tdp toast.2, tdp E3]
    remark:
      - "global operation [c]ommit（task 10）：開 textarea（tdp textarea，多行的 commit 訊息），標題 COMMIT，Esc 再 Enter 送出；git commit -F 收訊息，hooks 照樣跑。沒有 stage 任何檔案時停用（tdp M6）"
      - "merge 做到一半時，[c]ommit 開 confirm：內容是 git 準備好的 merge 訊息的第一行，Enter 用那份訊息 commit。不用 textarea 帶著訊息打開：tgo 的 textarea 沒改內容按 Enter 就關掉、不交出值（tdp K3：值沒改就不寫回），這裡要的是照原本的訊息做一件事"
      - "Amend（沒有熱鍵）：confirm（內容是上一個 commit 訊息的第一行），留著原本的訊息，把 staged 的改動併進上一個 commit（git commit --amend）；已經推上 upstream 時，內容多一句警告要 force push（Peach）。理由同上：不用 textarea 帶著舊訊息"
      - "成功 Success toast（Committed <短 hash> <標題>）；hook 擋下或失敗：error popup COMMIT FAILED，內容是 git 印的每一列（tdp note.6）。git 在背景跑，textarea 已經關了：寫好的訊息留著，下次按 [c]ommit 打開時就在裡面，commit 成功才清掉"
      - note: "textarea 打開時是空的，什麼都沒打就按 Enter，tgo 直接關掉、不寫錯誤；tdp K3 說打開時是空的、又不能空的欄位要照不合格處理（寫出錯誤、popup 不關）。暫時照 tgo 做：沒有 commit，什麼都沒發生；Check 擋的是改過之後又清空的訊息"
        issue: tgo #7
      - "textarea 的 Tab 是 input_tab_width 格空白（task 15 的設定，tdp E3）"
  - id: 14
    spec: 2
    request: merge 和解衝突：每個衝突的區塊都要選「用我的」「用對方的」或「兩個都要」，畫面得同時看得到兩邊
    tdp: [tdp panel.5, tdp panel.10, tdp panel.13, tdp K3, tdp K4, tdp K11, tdp P3, tdp M2, tdp M5, tdp M6, tdp confirm, tdp note.6, tdp note.7, tdp toast.2, tdp P5]
    remark:
      - "不用 tdp K11 的 app 自己的模式（idea.md 原本猜可能要用）：衝突的區塊是使用者一個一個挑出來處理的東西，tdp K11 寫明這種東西就是清單，用清單做；兩邊同時看得到用明細（tdp panel.13）"
      - "Working tree 的 [1] CHANGES 在衝突的檔上按 Enter，照 tdp panel.10 一層一層進去：[1] 換成這個檔的衝突區塊，一個區塊一列（Conflict 1 · lines 12–18），位置列 All changes › <路徑>；Esc 回到檔案清單，cursor 停在那個檔（tdp K4）"
      - "[2] 是 cursor 那個區塊的明細（tdp panel.13）：label CONFLICT: <路徑>，上面 MINE · <HEAD 的分支> 一段、下面 THEIRS · <合進來的> 一段，兩段的標題用 Teal 與 Mauve（tdp P5 內容的顏色），內容是那一段原本的行；合進來的那一段有 diff3 的 base 時不畫（先求兩邊）"
      - "區塊的 item operation：Use [m]ine、Use [t]heirs、Use [b]oth（mine first, then theirs），下框 hint 寫 Enter:read m:mine t:theirs b:both；Enter 把 focus 送到 [2] 讀長的區塊（tdp K3：清單上的 Enter 可以送 focus 到明細）。選了就改寫那個檔、那個區塊換成選的內容，cursor 到下一個區塊；最後一個區塊解完就 git add，Success toast <路徑> resolved and staged，[1] 回到檔案清單（那一層已經沒有東西了，tdp T1 的「那一項不在了」同理）"
      - "檔案那一層也有 Use [m]ine for the whole file、Use [t]heirs for the whole file（git checkout --ours／--theirs 再 git add），跟 SourceTree 的 Resolve using Mine／Theirs 一樣；一樣的動詞、一樣的鍵"
      - "merge、rebase、cherry-pick、revert 做到一半時（task 1 的 statusbar 寫著）：global operation [A]bort <merge／rebase／cherry-pick／revert>（confirm，警告這次做到一半的會不見）、Continue（rebase、cherry-pick、revert；還有衝突時停用）；merge 解完用 [c]ommit 結束（task 13）"
      - "記 App Log：Used mine in conflict 2 of README.md 之類，每一次選擇一筆"
