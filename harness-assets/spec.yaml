id: 59
from: v1.2.20
to: v1.3.0
tasks:
  - id: 1
    spec: 59
    request: 開啟時的畫面：左右兩個面板，左邊是分支列表，右邊是分支圖
    tdp: [tdp terms.2, tdp terms.3, tdp P3, tdp P5, tdp screen.1, tdp screen.2, tdp screen.3, tdp screen.4, tdp screen.7, tdp panel.1, tdp panel.4, tdp components.2, tdp components.4, tdp K1, tdp K2, tdp K9, tdp M4, tdp L1, tdp L2, tdp L3, tdp L4, tdp L5, tdp E5, tdp E8, tdp note.7, tdp screen.5, tdp confirm, tdp color, tdp F6, tdp L5, tdp panel.10]
    remark:
      - "拿掉 STATUS 說明牌（使用者 2026-11-22：「這樣 status 那個 panel 可以整個移除」；它在 [3] 上面只放原本 statusbar 那一列，剛合成一個畫面時加的）：Branch 在 [2] 的 ●（目前的分支）與 ↑N ↓N 看得到，repo 的名字不再顯示；做到一半的操作與正在跑的 git 指令寫在 [1] CHANGES 的位置列，取代 All changes（使用者：「放到 changes 那個 All changes 的那一個 row, 當有狀況的時候，就不需要顯示 All changes, All changes 只是個佔位文字」）；原本 statusbar 放不下時的優先順序（2026-11-20：「優先級: 狀態 > 分支 > repo」）跟著拿掉"
      - "merge、rebase、cherry-pick、revert 做到一半時，[1] 的位置列寫 <狀態 glyph> Merging: <對方>（Rebasing onto:、Cherry-picking:、Reverting:），進到衝突的檔裡時接 › <路徑>；git 指令在跑時寫在做什麼（Pushing…），兩個不同時出現（2026-11-22 前在 statusbar）。狀態的 glyph（使用者 2026-11-20：「merge conflict 發生中，status bar 應該要有一個狀態 icon 才對，顯示當前狀態」）：還有衝突的檔時 nf-md-alarm_light（跟 Warning toast 同一個 glyph），衝突都解完、可以 commit 或 continue 時 nf-md-check_circle（跟 Success toast 同一個）；放在位置列開頭的 icon（tdp panel.10：前面可以放一個 icon，跟那一列同色），整列 Lavender（tdp panel.10），原本 statusbar 上的 Peach、Green 沒有了；兩個 glyph 形狀不同，不靠顏色也分得出（tdp L5）"
      - |
        版面（一個畫面，使用者 2026-11-22；tdp screen.1：單畫面的 app 沒有 chip 列，statusbar 可以不要；打開時 focus 在 [2]）：
        ┌[1] CHANGES─────────────┐┌[3] CURRENTALL───────────────────────────────────────┐  ← [2] 帶頭：COMMITS（task 4、5）
        │ All changes            ││ main                                                 │  ← [1] 的位置列：merge 做到一半時寫 󰞏 Merging: <對方>
        │ STAGED                 ││    GRAPH  HASH     DESCRIPTION           AUTHOR DATE  │
        │   M notes.txt          ││    ◉      a1b2c3d  Fix the graph         vulcan …     │
        └─ Enter:unstage m:mark ─┘│    │ ◉    …                                           │
        ┏[2] BRANCHESR/T/S━━━━━━┓└─ Enter:files h|l:tab z:zoom ────────── 1 of 300 ──┘
        ┃ ● main ↑1              ┃┌[4] DESCRIPTION─────┐┌[5] FILES──────────────────────┐  ← [3] cursor 那個 commit（task 6）
        ┃   feature              ┃│ Fix the graph      ││ 9f8e7d6 ↔ a1b2c3d             │
        ┃                        ┃│                    ││ ~ internal/git/graph.go       │
        ┗━ Enter:show h|l:tab ━━━┛└─ z:zoom ───────────┘└─ Enter:diff ──────────────────┘
        Space:menu ?:help !:log Tab|1–5:panels q:quit
        focus 到 [1] 時右邊換成 [3] DIFF: <路徑>、[4] HISTORY: <路徑>（整個寬度），[5] 收起（task 11）
      - "一個畫面（使用者 2026-11-22：「把 working tree 和 history 的 tab 合併，把 working tree 的 changes panel 放到 history panel 1 的上方」「title header statusbar 和 history/working tree 的 tab 就可以移除了」，釋放上方的高度）：左邊 [1] CHANGES 在上、[2] BRANCHES 在下；右邊上面是 [3]，下面是 [4]、[5]。[3]、[4]、[5] 跟著 [1]、[2] 裡最後拿到 focus 的那一塊（tdp main debfb1b 的 L5「跟著帶頭 panel 換的 panel」、L5-4）：[2] 帶頭時是 COMMITS、DESCRIPTION、FILES；[1] 帶頭時是 [1] cursor 那個檔的 DIFF 與 HISTORY，[5] 收起、[4] 拿整個寬度；focus 移進 [3]、[4]、[5] 時不換。號碼照位置（tdp L5、K1）：[5] 收起時還是 5，數字鍵 5 不作用、Tab 跳過；footer 一律寫 1–5。原本兩個畫面 History 與 Working tree，畫面 chip 的熱鍵 H、W 跟著拿掉"
      - "2026-11-22 起號碼照位置：[1] CHANGES、[2] BRANCHES、[3] COMMITS／DIFF、[4] DESCRIPTION／HISTORY、[5] FILES。其他 task 的 remark 沒改的地方寫的是原本的號碼：History 的 [1] BRANCHES、[2] COMMITS、[3] DESCRIPTION、[4] FILES，Working tree 的 [1] CHANGES、[2] DIFF；畫面上的字（hint、空狀態、toast、說明）都照新的號碼改了"
      - "名字（使用者 2026-11-19：File status 怪、History 畫面裡又有一個 History panel 也怪）：git 的名詞是 working tree，在終端機用 git 的人認得它，所以第二個畫面叫 Working tree；畫面與 panel 不同名，[2] 放的是一個一個 commit，叫 COMMITS，第二個畫面的 [1] 放的是有改動的檔，叫 CHANGES（名字是 app 的內容：tdp terms.2、terms.3、panel.1、screen.3 只規定畫面 chip 與 [N] label 膠囊怎麼畫、怎麼大寫）"
      - "[4] DESCRIPTION 與 [5] FILES（2026-11-22 前是 [3]、[4]）在 [3] 下面，佔右邊高度的三分之一，左右 2:3（使用者 2026-11-20：常駐；拆成左右，左邊 description、右邊檔案；後來「增加 [4] 的寬佔比，減少 [3] 的寬佔比，給[3] zoom 效果，反正 [3] 只是拿來看」：原本各一半，60 欄時 [4] 只剩 16 格，位置列的兩個短 hash 被截掉，2:3 時 [4] 有 20 格；高度與寬度 app 自行決定，tdp L1：panel 怎麼拆 app 可以自行決定），32 列時還有 10 列"
      - "左邊（[1] CHANGES 在上、[2] BRANCHES 在下，高度 1:2：使用者 2026-11-22「左側的 panel 1 和 panel 2 高度比例為 1:2」，原本各一半；24 列時 [1] 7 列、[2] 16 列）與右邊照 1:2 分寬：60 欄時是 20｜40，分支名稱與分支圖都還讀得到（tdp L1 的為什麼）；最低尺寸 60×24（使用者 2026-11-20：80×24 的終端機也要能開；tdp L1：最低尺寸 app 可以調低、不能高於 60×32；24 列時 [3] 約 16 列、[4]、[5] 各 7 列），60 欄以上兩個 panel 一律並排，所以沒有窄寬（tdp screen.5 的門檻 app 自行決定，不能高於 60）"
      - "q、Ctrl-C：沒有 git 指令在跑時直接離開（tdp K9：離開流程 app 可以自行決定）；有 git 指令在跑（push、merge……）時先問（離開會把它中斷）；有 popup 開著時照 tdp K9 先問（tgo 做）"
      - "怎麼操作 git：呼叫使用者裝的 git 指令，不用 Go 的 git 函式庫（tdp P5：要呼叫哪些外部指令是功能邏輯）。理由：使用者的 git 設定（hooks、credential helper、ssh、gpg 簽章、pull.rebase）照樣生效；merge 與解衝突跟使用者在終端機打的 git 一模一樣；Go 的函式庫（go-git）沒有完整的 merge。git 指令都不給它終端機（自己的 session），所以不會在畫面上問密碼；要密碼時照錯誤處理（task 10）"
      - {note: "使用者 2026-11-22 要把 History 與 Working tree 合成一個畫面：CHANGES 放在 BRANCHES 上方；focus 在 CHANGES 時，右邊的 [2] 換成 cursor 那個檔的 diff、[3] 換成那個檔的歷史、[4] 收起，focus 回到 BRANCHES 時換回來；chip 列與 statusbar 拿掉，[2] 上面放一塊說明牌寫 branch 與 repo。跟著 focus 換內容、收起 panel 撞到 tdp L5（切換 focus 不能讓任何內容位移）與 L5-2；收起的 panel 的號碼 K1 也沒寫。合成一個畫面、拿掉 chip 列與 statusbar、說明牌照 tdp screen.1、screen.4、panel.17", issue: "送給 tdp session（2026-11-22）；tdp main debfb1b 收了（L5 的例外「跟著帶頭 panel 換的 panel」、L5-4；使用者選 A）：幾塊 panel 可以跟著幾塊帶頭的 panel 裡最後拿到 focus 的那一塊，換內容、收起一塊、讓旁邊的變寬，同一塊帶頭的每次都一樣，focus 移進跟著換的不換；號碼照位置，收起的那塊數字鍵不作用。tgo 要加 API（focus 換了的 hook 或 panel 組），tdp session 在問 terminu-go，出 beta 會送來；之前照 B（按 Enter 才換）；B 在 gittu 用不了（CHANGES 的 Enter 是 stage），跟 tdp session 說了。terminu-go v1.3.1-beta.2 加了 Screen.Following、Screen.Leads（gittu 2026-11-22 升上去照它做；tgo 的 AddScreen 先檢查 Enter 的 Details 才換上帶頭的 panel，所以 Panels 一開始寫 [1] 帶頭的樣子）。review 時 reviewer 要用 Read 讀 tdp main 的 principle/rules-zh_TW.md L5 與 checklist/items-zh_TW.md L5-4（還沒發版）"}
      - {note: "terminu-go v1.3.1-beta.2 的 AddScreen 檢查 Enter 的 ToDetails 時只看當下的 Panels，還沒照 Leads 換上帶頭的 panel：[1] CHANGES 衝突檔的 Enter（Show，focus 到 Details [3] DIFF）在 Panels 一開始寫 [2] 帶頭的樣子時會 panic。暫時 Panels 一開始寫 [1] 帶頭的樣子，AddScreen 之後 App.Focus([2])", issue: "送給 tdp session 轉 terminu-go（2026-11-22）；terminu-go main 1855dff 收了（還沒 tag，跟 v1.3.1 正式版一起出）：Details 在那個 panel 有 focus 時一定在畫面上就算數，帶頭的 panel 算它自己的 Shows；AddScreen 也檢查只出現在 Shows 裡的 panel 的動作。gittu 在 1855dff 上試過：不繞也過、Shows 裡的 panel 沒有被擋；升到 v1.3.1 時拿掉 App.Focus([2]) 的繞法"}
  - id: 2
    spec: 54
    request: 在終端機工作的人，在 repo 裡打 gittu 就打開那個 repo；還有 gittu version 與 gittu help
    tdp: [tdp E1, tdp P5]
    remark:
      - "gittu [路徑]：打開路徑所在的 git repo（repo 裡任何一個資料夾都可以，跟 git 一樣往上找）；沒給路徑是目前的目錄（tdp E1：其他指令 app 可以自行決定）"
      - "不是 git repo、路徑不在、找不到 git 指令時不開畫面：stderr 印 gittu: <原因>，結束碼 1，像 git 自己一樣（tdp P5 功能邏輯）"
      - "不認得的旗標（- 開頭）、兩個以上的路徑是用錯：stderr 寫 gittu: <哪裡錯>、空一行、用法，結束碼 2；資料夾剛好叫 version、help 時寫 ./version（help 裡寫明）。輸出照 tdp v1.2.18 的 E1（E1-4 到 E1-8）：結果到 stdout、錯誤到 stderr 開頭 gittu: 、結束碼 0 做完 1 沒做完 2 用錯、句子開頭大寫。gittu 沒有不開畫面又讀設定檔的指令，E3-40 管不到"
      - "gittu update（tdp v1.3.0 的 E1、E1-9、E1-10：每個 app 都要有）：照安裝的方式更新到最新的正式版，tgo terminu.SelfUpdate 做（Homebrew 用 vulcanshen/tap 升、安裝腳本裝的換掉執行檔、Scoop 印指令、從原始碼編的說請在那邊更新、比最新版新時說一聲）；從原始碼編的補一句怎麼更新：git pull && make install；更新完沒有別的事要做；help 列出它，資料夾叫 update 也要寫 ./update"
  - id: 3
    spec: 57
    request: 左邊是分支列表，看得到本地分支、遠端分支、tag、stash；upstream gone 也加個 glyph；點了分支，右邊的分支圖跳到那裡；在 panel 1 按 Enter 切換 focus 到 history panel，捲到那個分支的 commit 點；REMOTE 和 TAG 用分頁作，不要都擠在一個 panel
    tdp: [tdp panel.1, tdp panel.4, tdp panel.5, tdp panel.7, tdp panel.13, tdp panel.14, tdp terms.4, tdp K12, tdp screen.8, tdp components.5, tdp P5, tdp K3, tdp toast.2, tdp panel.15, tdp M5, tdp note.8, tdp note.7, tdp F5, tdp panel.10, tdp panel.9]
    remark:
      - "[1] 有四個分頁（tdp terms.4、panel.4）：BRANCHES（本地分支）、REMOTES（遠端分支，origin/main）、TAGS、STASHES；h|l 切換（tdp K12：一維清單放在有 tab 的 panel 裡，h|l 給 tab），下框 hint 在 Enter 後面寫 h|l:tab（tdp panel.1）。原本是一個清單分四組，使用者 2026-11-19 要 REMOTE 和 TAG 分頁、不要都擠在一個 panel；stash 也是另一種東西，一起拆成分頁。每個分頁是一般清單（tdp panel.5），照名稱排（tag 照版本的數字排，v1.10 在 v1.9 後面；stash 照 stash@{N} 的 N），tdp panel.5 的順序固定；每個分頁有自己的 cursor 與 / 篩選"
      - "沒有東西的分頁是空狀態（tdp screen.8）：No remote branches / Press [f] to fetch every remote；No tags / Press [t] to tag HEAD；No stashes / Press [S] to stash the changes；提示點名的鍵現在按不動時（沒有 remote、還沒有 commit、沒有改動，tdp M6 停用）改點名 Space（Press [Space] to see what you can do here），沒有 remote 的事實改寫 This repository has no remote（提示裡的鍵是 global operation 的熱鍵，在 [1] 上按得到）"
      - "單欄、不畫表頭（tdp panel.5：單欄的表頭 app 可以自行決定）。目前的分支在標記欄畫 Green 的 ●（tdp panel.7：不能標記的清單，app 可以把一種旗標畫在標記欄，glyph 與顏色 app 可以自行決定；跟 locku 的啟用中 profile 一樣）"
      - "本地分支有 upstream 時，名稱後面接 ↑N ↓N（Overlay0，只寫不是 0 的）（tdp P5 領域的符號與顏色）。upstream 在遠端被刪掉了（git 寫 [gone]）時寫 nf-md-cloud_off_outline（U+F0165）加 upstream gone，用 Peach（glyph 是使用者 2026-11-19 要的，跟分支圖的 ref 一樣有 glyph）（值得注意：多半是合併完、遠端刪掉的分支，可以刪了）；原本只寫 gone，使用者看不懂（2026-11-19）"
      - "stash 一列寫 stash@{N}: <訊息>，訊息太長從尾端截（tdp panel.5）"
      - "/ 篩選（tdp panel.14）：分支多的 repo 找分支"
      - "cursor 移到分支、遠端分支、tag 上時（換分頁也算：換到的那一頁的 cursor），[2] COMMITS 的 cursor 跟著移到它指的 commit（不在目前的分支圖裡就不動）；focus 留在 [1]。這跟明細（tdp panel.13）一樣是「另一個 panel 跟著 cursor 換」，不移動 focus（tdp K3）；[2] 看得到的跟著換（tdp panel.13：cursor 一移動，明細的內容立刻換成新的那一筆）"
      - "分支、遠端分支、tag 上的 Enter：focus 到 [2] COMMITS，cursor 停在它指的 commit、捲到看得到。這個 Enter 與 cursor 移動都是 app 自己把 [2] 的 cursor 放到一個 commit 上：先清掉 [2] 的篩選，不管它有沒有擋住那個 commit；只是 focus 離開 [2] 不清（tdp v1.2.18 的 panel.14、panel-180，使用者 2026-11-19 在 tdp session 選 A）；hint Enter:show（使用者 2026-11-19：Enter 不要 checkout，checkout 是 [c]heck out，task 8）。按 Enter 就預期換到分支圖，所以可以移動 focus（tdp K3：app 的動作可以移動 focus，條件是使用者按下去時就預期會換）；換 focus 不記 App Log（tdp note.7）。它指的 commit 不在分支圖裡（超過讀進來的 1000 個）時不移動，跳 Info toast 說它不在分支圖裡"
      - "遠端分支沒有對應的本地分支（沒有本地分支追蹤它、也沒有同名的；git.Snapshot.Tracked）時，Enter 是 Check out（as a local branch, and show it in [3]；hint Enter:check out）：照 [c]heck out 一樣先 confirm，git checkout -b <名> --track <遠端分支>，成功後 [2] 的 cursor 停在它、focus 到 [2]（使用者 2026-11-20：「如果 local 沒有 checkout 該 remote branch, 那就先 checkout 到 local, 然後切過去」；這一種的 Enter 改成 checkout，其他的 Enter 照樣只顯示，原本 2026-11-19 說的 Enter 不要 checkout 是對本地分支）。有對應的本地分支的遠端分支在分支圖裡畫得出來（task 18），Enter 照樣是 Show"
      - "2026-11-20 起 [2] 不再進到 commit 的檔案（task 6 改放在 [3]）；比較模式（task 7）進到的清單裡 Tab、數字鍵不作用，[1] 動不了，所以不用再退回分支圖（原本用 tgo Panel.LeaveDiff，2026-11-19 回報給 tdp session 的缺口，terminu-go v1.2.18 加的）"
      - "repo 一個分支都沒有（剛 git init、還沒 commit）時是空狀態（tdp screen.8）：No branches yet / Press [Space] to see what you can do here"
  - id: 4
    spec: 57
    request: 右邊是分支圖，在終端機裡把分支線畫得清楚又好看，大 repo 裡也要夠快；commit 點不要只是單調的圓點
    tdp: [tdp panel.5, tdp panel.7, tdp panel.10, tdp panel.14, tdp panel.15, tdp screen.8, tdp components.5, tdp P4, tdp P5, tdp L2, tdp components.2, tdp F5]
    remark:
      - "[2] COMMITS 是一般清單（tdp panel.5），一個 commit 一列，欄：GRAPH、HASH（短 hash，7 格；panel 叫 COMMITS，欄不再叫 COMMIT）、DESCRIPTION（ref 加上標題，可以截短）、AUTHOR（可以截短）、DATE（YYYY-MM-DD）。欄放不下時先收 DATE、再收 AUTHOR（tdp panel.5 的整欄收）"
      - "分支線自己排，一個 commit 一列，不用 git log --graph 的輸出：git 的圖會多出只有線、沒有 commit 的列，cursor 會停在不是 commit 的地方。畫法：每一條線一欄兩格，commit 是 ◉（U+25C9）：使用者 2026-11-19 嫌 ● 單調，看了 Nerd Font 的圓圈（nf-md-source_commit、nf-md-record_circle……）在自己終端機上的預覽後選的。Nerd Font 的 icon 在會讓 icon 溢出到下一格的終端機上，下一格空白時畫得大、下一格是線（─）時縮成一格，同一個 glyph 一個大一個小；◉ 是一般的 Unicode，一律畫在一格裡。往下的線 │，合進來、分出去用 ─ ╮ ╯ ╭ ╰，線交叉 ┼；每條線一個顏色，照分出來的順序輪 Blue、Green、Mauve、Peach、Teal、Pink、Sapphire、Flamingo（tdp P5：內容的符號與顏色是領域的；不用模式的 Yellow 與使用者足跡的 Lavender，tdp P4）。線線畫幾條照 [2] 的寬度（使用者 2026-11-20）：HASH、DESCRIPTION（照最長的標題）、AUTHOR、DATE 放完之後剩下的寬度，一條線兩格，至少 10 條；還放不下的線，最後一格畫 …（L2：GRAPH 欄不會無限變寬、也不擠其他欄）；[2] 變寬變窄（終端機縮放、放大）時重排"
