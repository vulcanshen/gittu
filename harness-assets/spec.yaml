      - "[1] CHANGES 是一般清單分三組（tdp panel.11）：CONFLICTS、STAGED、UNSTAGED（沒追蹤的檔也在 UNSTAGED）；同一個檔 stage 了一部分時兩組各一列。一欄、沒有表頭：改了什麼的字母寫在路徑前面（M Peach、A Green、D Red、R Blue、? Overlay0（沒追蹤）、U Red（衝突）），太長時 gittu 自己把路徑從前面截到放得下（…接在字母後面），字母一定留著（使用者 2026-11-20 選的；原本交給 tgo 的 Path 從前面截整列，很長的路徑會連字母一起截掉）；篩選照樣比對完整的路徑（tgo Row.Cells 是完整的、Row.Styled 是截過的）；拆成字母一欄、路徑一欄會多一列表頭 FILE，使用者選一欄。標記欄留給標記的勾（task 21；tdp panel.7：可以標記的清單，標記欄只放勾，旗標寫在內容裡），2026-11-20 前字母畫在標記欄。位置列寫 All changes（畫面已經叫 Working tree，不再重複；進到衝突的檔裡時接上那一層，task 14）；2026-11-22 起 merge 做到一半、git 指令在跑時，那一列寫狀態，取代 All changes（task 1）"
      - "[2] DIFF 是 [1] cursor 那個檔的明細（tdp panel.13，跟著 cursor 即時換）：label 寫 DIFF: <路徑>；畫的是那個檔的兩個版本（跟 Enter 打開的比較同兩邊），照 UNIFIED 的樣子（tdp v1.2.18 的 note.8「在 panel 裡」、note-103，使用者 2026-11-19 選 A；tgo Pager.SetDiff）：只畫有差異的段落、前後 3 行、分隔線、兩欄行號、- Red、+ Green，不放 git diff 的 diff --git 與 @@；位置列寫 <舊的> ↔ <新的>；兩邊一樣時空狀態 No differences between the two / Press [1] to go to the files；二進位檔（前 8000 位元組有 NUL，跟 git 判的一樣）空狀態 Not a text file: no lines to compare / Press [1] to go to the files（tdp screen.8：一句事實、一句點名按鍵的提示）；沒追蹤的資料夾照 panel.9 列出裡面的檔、每個標 +（Green），Enter 進到那份清單，跟進到一個 commit 一樣（tdp v1.2.18 的 note.8、note-106，使用者 2026-11-19 在 tdp session 選 A；tgo Pager.SetDiffItems，v1.2.19-beta.2）；[1] 換到另一列時先退出 [2] 進去的清單（Panel.LeaveDiff）；讀不到時照 tdp panel.15：沒有舊內容寫兩句（Can't show the change: <說原因的那一行> / Press [R] to read it again），同一列重新讀時讀不到則舊的內容留著、Error toast；那一句與 git 的全文記進 App Log（tdp F5、components.5）；沒有 cursor 的 panel（tgo Pager），j|k 捲動"
      - "[2] DIFF 上的 Enter（[Enter] Compare，hint Enter:compare；tdp K3：沒有項目的 panel，Enter 對整個 panel 做最直觀的事）打開 tdp note.8 的比較（同一項的兩個版本，舊的當 anchor）：STAGED 的是 <路徑> @ HEAD ↔ <路徑> @ index，UNSTAGED 的是 <路徑> @ index ↔ <路徑>（工作區；沒追蹤的檔左邊是空的），衝突的檔是 <路徑> @ HEAD ↔ <路徑>（工作區、有衝突標記；比較的畫法同 task 6），進到衝突區塊時是 MINE · <標記> ↔ THEIRS · <標記>；二進位檔沒有比較（Enter 隱藏）。由 tgo 的 App.OpenDiff 畫，記 App Log：Compared <左> with <右>"
      - "沒有改動時是空狀態（tdp screen.8）：Nothing to commit / Press [2] to see the history"
      - "重新讀（task 19）時，[2] 的內容換了就重新放進去（tdp note.9 的重新讀進來；不算串流，失焦時變暗）"
      - "[2] DIFF 原本用 Pager 畫 git diff 的 patch；2026-11-19 回報給 tdp session 的缺口（panel 畫不出 note.8 的 UNIFIED），terminu-go v1.2.19-beta.1 加了 Pager.SetDiff，已經照它改"
      - "還沒追蹤的檔與資料夾，[2] 的位置列與清單裡每一項左邊寫 <路徑> @ empty（使用者 2026-11-20 選 1；原本寫 @ index，可是 index 裡沒有它），跟 History 裡 commit 新增的檔一樣寫 empty"
      - "沒有改動時 [2]（現在的 [3] DIFF）的空狀態提示寫 Press [H] to see the history，跟 [1] 一樣（使用者 2026-11-20 選 1；原本寫 Press [1] to go to the files，可是 [1] 沒有檔可以去）；有檔時（二進位檔、沒有差異、空的資料夾）照舊叫你按 [1]。2026-11-22 合成一個畫面後 H 拿掉了，[1]、[3]、[4] 都寫 Press [2] to see the history：按 2，[2] 帶頭，右邊換成 commit"
      - "[4] HISTORY（[1] 帶頭時；使用者 2026-11-22：「panel 3 換成 panel 2 cursor 的那個檔案的 history」，當時的 panel 2 是 diff，所以是 [1] cursor 那個檔）：改過那個檔的 commit，新的在前，跟著 [1] 的 cursor 換（tdp panel.13）；label HISTORY: <路徑>；欄跟 [3] 的 COMMITS 一樣、沒有分支圖：HASH、DESCRIPTION、AUTHOR、DATE（SpreadFill、DESCRIPTION 吃掉多的寬度，tdp panel.5）；/ 篩選（tdp panel.14）；讀 git log HEAD -- <路徑>，最多 1000 個，不跟著改名（git log --follow 只跟得了一個檔，還要每個 commit 的舊路徑；README 的限制寫明）；還沒 commit 的改名用舊的路徑（新的路徑還沒有 commit）；衝突的檔進去了（task 14）時是那個檔；同一個檔、同一個 HEAD 只讀一次"
      - "[4] HISTORY 的空狀態（tdp screen.8）：沒有檔 No file to show / Press [1] to go to the files（沒有改動時 Press [2] to see the history，跟 [3] 一樣）；還沒有 commit 時 No commits yet / Press [1] to go to the files；檔案還不在任何 commit 裡（沒追蹤、新加的）Not in any commit yet / Press [1] to go to the files；讀不到時 Can't read the history of <路徑>: <說原因的那一行> / Press [R] to read it again（tdp panel.15），下次讀 repo 時再試"
      - "[4] HISTORY 的 commit 上 Enter（[Enter] Diff — this commit's change to the file, UNIFIED or SPLIT；hint Enter:diff）：tdp note.8 的比較，<路徑> @ <第一個 parent 的短 hash> ↔ <路徑> @ <commit 的短 hash>（第一個 commit 左邊寫 empty、是空的），跟 [5] FILES 的 Enter 同一種（tdp K3）；那個 commit 裡是二進位檔（git log --numstat 寫 - -）時停用（tdp panel.9、M6）；記 App Log：Compared <左> with <右>（tdp note.7）"
