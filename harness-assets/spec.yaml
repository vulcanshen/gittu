      - "每次刷新拿讀到的跟上一次比：HEAD、本地分支、遠端分支、tag、stash、做到一半的操作、每個檔的狀態，加上 [2] DIFF 正在畫的那個檔的內容（git status 看不出已經改過的檔又改了一次）。有不一樣才在 App Log 記一筆 Info（tdp note.7：app 自己在背景做的事），寫出變了什麼：Changed outside gittu: <最多三項>（多的接 and N more）；沒變的刷新不記，App Log 才不會被每 3 秒一筆洗掉（tdp v1.2.18 的 note.7、note-104：app 自己重讀的內容只有讀到變了才記一筆 INFO，使用者 2026-11-19 在 tdp session 選 A）"
      - "gittu 自己的操作做完馬上重讀，下一次刷新跟它比就沒有差別，所以自己的操作不會被記成外面的變動；按 R 的照 task 10 記 Info toast"
